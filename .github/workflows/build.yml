name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/MuhanPerfOpt/MuhanPerfOpt.csproj

      - name: Patch - replace XamlCompiler.exe with dummy
        shell: pwsh
        run: |
          $sdkPath = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk"
          $dummyContent = 'using System; class Dummy { static void Main(string[] a) { Console.WriteLine("XamlCompiler skipped"); Environment.Exit(0); } }'
          Get-ChildItem $sdkPath -Directory | ForEach-Object {
            $verPath = $_.FullName
            # Patch PriGen
            Get-ChildItem "$verPath\buildTransitive" -Filter "*.targets" -Recurse | ForEach-Object {
              $c = Get-Content $_.FullName -Raw
              $new = $c.Replace('<Microsoft.Build.Packaging.Pri.Tasks.ExpandPriContent', '<!-- DISABLED_PRI -->')
              if ($new -ne $c) {
                Write-Host "Patched PriGen in $($_.Name)"
                Set-Content $_.FullName -Value $new -NoNewline
              }
            }
            # Replace XamlCompiler.exe and XamlCompiler.dll with dummy
            Get-ChildItem "$verPath\buildTransitive\..\tools\net472" -Filter "XamlCompiler*" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Replacing $($_.Name) at $($_.FullName)"
              $bak = $_.FullName + ".bak"
              Move-Item $_.FullName $bak -Force
              Set-Content -Path $_.FullName -Value "" -NoNewline
            }
          }

      - name: Publish
        run: dotnet publish src/MuhanPerfOpt/MuhanPerfOpt.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/win-x64 -m:1

      - name: Install Inno Setup
        if: success()
        run: winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements

      - name: Build Installer
        if: success()
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" setup/MuhanPerfOpt.iss'

      - name: Upload Setup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muhan-perf-opt-setup
          path: setup/output/*.exe
