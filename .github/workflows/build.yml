name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore .\src\MuhanPerfOpt\MuhanPerfOpt.csproj

      - name: Patch PriGen
        run: |
          Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk\*\buildTransitive" -Filter "*.targets" -Recurse | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $new = $c.Replace('<Microsoft.Build.Packaging.Pri.Tasks.ExpandPriContent', '<!-- DISABLED -->')
            if ($new -ne $c) {
              Write-Host "Patched $($_.Name)"
              Set-Content $_.FullName -Value $new -NoNewline
            }
          }

      - name: Publish
        run: dotnet publish .\src\MuhanPerfOpt\MuhanPerfOpt.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\publish\win-x64

      # 下面的 step 只有在 Publish 成功时才会执行
      - name: Verify
        if: success()
        run: Get-ChildItem -Recurse .\publish\win-x64 | Measure-Object | Select-Object Count

      - name: Install Inno
        if: success()
        run: winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements

      - name: Build Installer
        if: success()
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\setup\MuhanPerfOpt.iss

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Setup
          path: setup\output\*.exe
