name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/MuhanPerfOpt/MuhanPerfOpt.csproj

      - name: Publish
        run: dotnet publish src/MuhanPerfOpt/MuhanPerfOpt.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: Install Inno Setup
        if: success()
        run: winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements

      - name: Build Installer
        if: success()
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" setup/MuhanPerfOpt.iss'

      - name: Upload Setup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muhan-perf-opt-setup
          path: setup/output/*.exe
