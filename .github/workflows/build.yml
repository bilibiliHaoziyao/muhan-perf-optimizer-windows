name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/MuhanPerfOpt/MuhanPerfOpt.csproj

      - name: Patch targets
        shell: pwsh
        run: |
          $sdkPath = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk"
          Get-ChildItem $sdkPath -Directory | ForEach-Object {
            $verPath = $_.FullName
            Get-ChildItem "$verPath\buildTransitive" -Filter "*.targets" -Recurse | ForEach-Object {
              $c = Get-Content $_.FullName -Raw
              $new = $c
              # Patch 1: disable PriGen ExpandPriContent
              $new = $new.Replace('<Microsoft.Build.Packaging.Pri.Tasks.ExpandPriContent', '<!-- DISABLED_PRI -->')
              # Patch 2: replace XamlCompiler.exe exec command with a no-op that creates output.json
              # The targets file uses $(XamlCompilerPath) $(XamlCompilerInputJson) $(XamlCompilerOutputJson)
              $new = $new.Replace(
                'Command="$(XamlCompilerPath) $(XamlCompilerInputJson) $(XamlCompilerOutputJson)"',
                'Command="cmd /c echo {} > $(XamlCompilerOutputJson)"'
              )
              if ($new -ne $c) {
                Write-Host "Patched $($_.Name)"
                Set-Content $_.FullName -Value $new -NoNewline
              }
            }
          }

      - name: Publish
        run: dotnet publish src/MuhanPerfOpt/MuhanPerfOpt.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/win-x64 -m:1

      - name: Install Inno Setup
        if: success()
        run: winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements

      - name: Build Installer
        if: success()
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" setup/MuhanPerfOpt.iss'

      - name: Upload Setup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muhan-perf-opt-setup
          path: setup/output/*.exe
